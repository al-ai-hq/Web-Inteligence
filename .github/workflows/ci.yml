# Status: draft for review. Owner: tech lead.
#
# Supply chain: every third-party action is pinned to a full commit SHA.
# The tag is kept in a trailing comment. SHAs were resolved on 2026-10-01
# with `gh api repos/<owner>/<repo>/commits/<tag>`. See
# intent/INT-00-m0a-repository-bootstrap/intent.md.
#
# Jobs:
#   governance - hook tests, schema check, config check, action-pin check, M0B proofs, M2 readiness, M3 access, M4 source separation, M5 experience effectiveness, M6 AI visibility, M7 public footprint, M8 local content gate
#   secrets    - gitleaks over the full history
#   app        - lint, typecheck, unit tests, SSRF placeholder, browser placeholder
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install pyyaml jsonschema
      - name: Hook tests
        run: python3 -m unittest discover -s .claude/hooks/tests -v
      - name: Cursor hook gate tests
        run: python3 -m unittest discover -s .cursor/hooks/tests -v
      - name: Schema check
        run: python3 scripts/check_schemas.py
      - name: Config check
        run: python3 scripts/check_config.py
      - name: M3 access
        run: python3 scripts/check_m3_access.py
      - name: M4 source separation
        run: python3 scripts/check_m4_sources.py
      - name: M5 experience effectiveness
        run: python3 scripts/check_m5_experience.py
      - name: M6 AI visibility
        run: python3 scripts/check_m6_visibility.py
      - name: M7 public footprint
        run: python3 scripts/check_m7_footprint.py
      - name: M8 local content gate
        run: python3 scripts/check_m8_content.py
      - name: M2 readiness
        run: python3 scripts/check_m2_readiness.py
      - name: Action pins
        run: python3 scripts/check_action_pins.py
      - name: M0B proofs
        run: python3 scripts/check_m0b_proofs.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # OI-021 stays open: organization-owned repositories may need a
      # GITLEAKS_LICENSE secret. The action stays; only its SHA is pinned.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # engines.node is 22.x (M0A toolchain).
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: SSRF placeholder
        run: pnpm test:ssrf
      - name: Browser placeholder
        run: pnpm test:e2e
