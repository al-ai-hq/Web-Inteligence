# Status: M0A. Owner: tech lead.
#
# Supply chain: third-party actions use version tags. At the next security
# review, pin every `uses:` to a full commit SHA (keep the tag in a trailing
# comment) and let a dependency bot propose updates.
#
# Jobs:
#   governance - hook tests, validator regression tests, schema check, config check
#   secrets    - gitleaks over the full history
#   app        - lint, typecheck, unit tests, SSRF suite (Node 22 LTS, pnpm)
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checker dependencies
        run: pip install -r requirements-dev.txt
      - name: Hook tests
        run: python3 -m unittest discover -s .claude/hooks/tests -v
      - name: Validator regression tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Schema check
        run: python3 scripts/check_schemas.py
      - name: Config check
        run: python3 scripts/check_config.py

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: SSRF suite
        run: pnpm test:ssrf
