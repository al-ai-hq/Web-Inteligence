# Purpose: Rule definitions for the Crawlability and indexability category (weight 20) of Presence Readiness,
#          including the v2 rule changes and the connected-tier Search Console rules.
# Owner role: Methodology owner (SEO lead)
# Source sections: v1-baseline §6.3-§6.4, §7, §7.1; 02-DETAILED-SPECIFICATION §6, §15;
#                  08-REFERENCE-LIBRARY (Google Search guidance, Search data APIs, Standards)
# Status: draft for review
#
# Field notes:
# - importance_weight: integer 1-5 for scored rules; 0 for scored: false (never in a denominator).
# - standards.pass: quoted from the source. standards.partial: the sources give none, so each is a
#   <DECIDE_AT_M0> placeholder to calibrate on the labelled site set. standards.fail: the rule fails
#   when neither the pass nor the partial standard is met.
# - evaluation: deterministic (rules engine) or assessed (Auditor agent with a rubric, labelled "assessed").
#   Classification follows v1-baseline §5.4 (deterministic rules) and the semantic-rule list in
#   02-DETAILED-SPECIFICATION §13; reclassifying a rule bumps methodology_version.
# - fidelity_label: label of the rule result (computed, assessed, observed, attested).
# - GSC-* placement in this category is an ASSUMPTION: 02-DETAILED-SPECIFICATION §6 does not assign
#   categories to new rules; index status and AI-features eligibility are Access-layer checks.

methodology_version: "0.1.0-draft"
category: crawlability
category_title: "Crawlability and indexability"
category_weight: 20

rules:
  - id: CRW-001
    title: "Homepage reachable"
    category: crawlability
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Canonical homepage returns usable HTML after safe redirects."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    critical_cap: homepage_unretrievable
    change: unchanged
    source_reference: ["v1-baseline §7.1", "v1-baseline §6.4"]

  - id: CRW-002
    title: "Important pages reachable"
    category: crawlability
    importance_weight: 4
    scored: true
    connected_tier_only: false
    applicability: "All audits with a selected set of important pages. The result describes the sample, not the whole site."
    standards:
      pass: "At least 90% of selected important pages return usable 2xx responses."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.1"]

  - id: CRW-003
    title: "Site-wide indexability"
    category: crawlability
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "No unintended site-wide noindex or X-Robots-Tag block."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    critical_cap: sitewide_noindex
    change: unchanged
    source_reference:
      - "v1-baseline §7.1"
      - "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"

  - id: CRW-004
    title: "robots.txt availability and syntax"
    category: crawlability
    importance_weight: 3
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "File is reachable or validly absent and contains no unintended general block."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    critical_cap: robots_blocks_general_search
    change: unchanged
    source_reference:
      - "v1-baseline §7.1"
      - "https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec"
      - "https://www.rfc-editor.org/rfc/rfc9309"

  - id: CRW-005
    title: "XML sitemap"
    category: crawlability
    importance_weight: 3
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Valid sitemap exists and contains canonical indexable URLs."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.1", "https://www.sitemaps.org/protocol.html"]

  - id: CRW-006
    title: "Canonical consistency"
