  - id: CRW-009
    title: "Status-code integrity"
    category: crawlability
    importance_weight: 3
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "No material soft 404 or important 4xx/5xx pages."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.1 gives the pass standard only>"
