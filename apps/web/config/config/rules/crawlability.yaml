  - id: CRW-010
    title: "AI/search bot policy visibility"
    category: crawlability
    importance_weight: 2
    scored: true
    connected_tier_only: false
    applicability: "All audits. Uses config/crawler-registry.yaml; training and search crawlers are judged separately."
    standards:
      pass: "Each crawler's access matches the owner's stated intent; directives do not conflict. Training-bot blocks are reported, not failed."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: modified
    v1:
      pass: "Relevant crawler directives are explicit and non-conflicting."
      importance_weight: 2
    notes:
      - "Blocking a training crawler is a business choice, not a defect (02-DETAILED-SPECIFICATION §2)."
      - "<DECIDE_AT_M0: where the owner's stated intent comes from in an anonymous audit (intake answer or default) and the result when no intent is stated>"
      - "When a low Gemini visibility result coincides with a Google-Extended block, the report names that cause (02-DETAILED-SPECIFICATION §6)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6 (Rule changes, AI crawler registry)"
      - "v1-baseline §7.1"
      - "https://developers.google.com/search/docs/appearance/ai-features"

  - id: CRW-011
    title: "Agent parity"
    category: crawlability
    importance_weight: 4
    scored: true
    connected_tier_only: false
    applicability: >-
      All audits, with a tier-dependent method. Crawler user agents are used only for connected sites,
      on a few key URLs per agent, and never retried past a block. Free and anonymous audits compare a
      browser with the platform's own declared crawler.
    standards:
      pass: "Key pages return the same status, title, language, word count and structured data to a browser, Googlebot, Bingbot and search AI crawlers, with no bot challenge or 403."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: assessed
    change: new
    notes:
      - "Labelled inferred: CDNs may verify real bots by IP, so a user-agent test can differ from what the real crawler sees (02-DETAILED-SPECIFICATION §6, §15)."
      - "Only the product's sandboxed crawler fetches (D-009)."
    source_reference: ["02-DETAILED-SPECIFICATION §6", "02-DETAILED-SPECIFICATION §15"]

  - id: CRW-012
    title: "Snippet eligibility"
    category: crawlability
    importance_weight: 3
    scored: true
    connected_tier_only: false
    applicability: "All audits; evaluated on key pages."
    standards:
      pass: "Key pages are indexable and not limited by nosnippet or a restrictive max-snippet, which Google's AI features require."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "<DECIDE_AT_M0: which max-snippet values count as restrictive; confirm against the robots meta tag documentation>"
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developers.google.com/search/docs/appearance/ai-features"
      - "https://developers.google.com/search/docs/crawling-indexing/robots-meta-tag"

  - id: GSC-001
    title: "Important pages indexed (URL Inspection)"
    category: crawlability
    importance_weight: 5
    scored: true
    connected_tier_only: true
    applicability: "Connected tier only, with a read-only Search Console connection. Samples important pages first within the URL Inspection quota."
    standards:
      pass: "URL Inspection shows at least 90% of important pages indexed."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "Quota values live in config/policy-facts.yaml (pf-gsc-url-inspection-quota), not in code."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developers.google.com/search/blog/2022/01/url-inspection-api"

  - id: GSC-002
    title: "Included in generative AI features (Search Console setting)"
    category: crawlability
    importance_weight: 5
    scored: true
    connected_tier_only: true
    applicability: "Connected tier only."
    standards:
      pass: "Site is included in generative AI features in Search Console; Google requires this for eligibility."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    fidelity_label_fallback: attested
    change: new
    notes:
      - "Attested when the setting cannot be read through an API; the Owner confirms it in the checklist (02-DETAILED-SPECIFICATION §6)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"
      - "https://blog.google/products-and-platforms/products/search/new-controls-website-owners/"

  - id: GSC-003
    title: "Generative AI impressions (imported export)"
    category: crawlability
    importance_weight: 0
    scored: false
    connected_tier_only: true
    applicability: "Connected tier only, when the Owner uploads a Search Console generative AI performance export."
    standards:
      report: "Generative AI impressions imported from a Search Console export, shown by page, country, date and device. Observational, unscored."
    evaluation: deterministic
    fidelity_label: observed
    change: new
    notes:
      - "Observed presence, reported beside Presence Readiness and never inside it (D-012)."
      - "The report is UI-only; independent 2026 checks found it absent from the Search Analytics API. Impressions only; never compute a CTR from it."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://support.google.com/webmasters/answer/16984139"
      - "https://developers.google.com/search/blog/2026/06/gen-ai-performance-reports"
