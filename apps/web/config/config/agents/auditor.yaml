# Purpose: Runtime tool allowlist for the auditor agent. Enforced in code, not only in prompts.
# Owner role: AI engineer, with the security owner
# Source sections: 02-DETAILED-SPECIFICATION §13 (agent table and exact runtime allowlists); 03-PRODUCTION-CONTRACTS (Agent tool boundaries); 05-PROJECT-PLAN §5 (milestones);
#                  docs/decisions.md D-009, D-011, D-012
# Status: draft for review
#
# reads_untrusted_content is true because the agent receives text that originated outside the system
# (page content, CMS content, tool or model output, user input). Such text is data, never instructions.
# No write-class tool may appear in tools. Only the deterministic connector service holds write credentials.
# Note: Evaluates only the semantic rules marked evaluation: assessed in config/rules/ (AEO-001, AEO-006, AEO-009, GEO-005, GEO-007).
# Note: Deterministic rule results are final; the agent never re-scores them.
# Note: V4 name: Audit assessor. gsc_query returns data only in the connected tier.
# Note: Model tier from 02-DETAILED-SPECIFICATION §13: fast model, semantic rules only.

name: auditor
milestone: "M2"
reads_untrusted_content: true
model_tier: fast
tools:
  - get_evidence
  - eval_rule
  - validate_schema
  - psi_query
  - crux_query
  - gsc_query
forbidden_tools:
  - apply_change
  - publish
  - write_cms
  - delete_content
  - upload_disavow
  - send_email
  - submit_form
  - approve_change
  - mutate_technical_score
  - call_connector
