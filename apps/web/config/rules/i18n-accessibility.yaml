# Purpose: Rule definitions for the Internationalization, accessibility, and mobile UX category (weight 10)
#          of Presence Readiness, including the agent-readiness rules AGT-001 and AGT-002.
# Owner role: Methodology owner (SEO lead), with the Arabic editorial and accessibility owners
# Source sections: v1-baseline §2.4, §6.3, §7, §7.6; 02-DETAILED-SPECIFICATION §6, §13;
#                  08-REFERENCE-LIBRARY (hreflang, W3C dir attribute, WCAG 2.2, Agent-friendly websites,
#                  WebMCP, Lighthouse agentic browsing)
# Status: draft for review
#
# Field notes: see config/rules/crawlability.yaml.
# AGT-* placement in this category is an ASSUMPTION: 02-DETAILED-SPECIFICATION §6 assigns them no
# category; AGT-001 relies on semantic HTML and accessible names, like A11Y-002.
# Do not claim full WCAG conformance from automated testing alone (v1-baseline §7.6).
# Agent-readiness checks never submit forms, orders or bookings (02-DETAILED-SPECIFICATION §13).

methodology_version: "0.1.0-draft"
category: i18n_accessibility
category_title: "Internationalization, accessibility, and mobile UX"
category_weight: 10

rules:
  - id: I18N-001
    title: "Document language"
    category: i18n_accessibility
    importance_weight: 4
    scored: true
    connected_tier_only: false
    applicability: "All audited pages."
    standards:
      pass: "Every audited page declares the correct BCP 47 language."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.6"]

