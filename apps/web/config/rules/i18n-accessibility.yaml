  - id: AGT-001
    title: "Agent-operable forms and actions"
    category: i18n_accessibility
    importance_weight: 2
    scored: true
    connected_tier_only: false
    applicability: "Sites with key forms or actions (booking, ordering, quote, enquiry); otherwise not_applicable."
    standards:
      pass: "Key forms and actions work through semantic HTML and accessible names, for assistive tech and browser agents."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "Never submit a form, order or booking during the check (02-DETAILED-SPECIFICATION §13)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://web.dev/articles/ai-agent-site-ux"

  - id: AGT-002
    title: "WebMCP and Lighthouse agentic checks"
    category: i18n_accessibility
    importance_weight: 0
    scored: false
    connected_tier_only: false
    applicability: "Only for sites whose key tasks run through forms. Reported, unscored."
    standards:
      report: "Report WebMCP declarations and the Lighthouse agentic browsing result with the Chrome and Lighthouse version and date."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "WebMCP is an origin trial from Chrome 149; Lighthouse's agentic browsing category is experimental and needs Chrome 150 (policy facts pf-webmcp-origin-trial and pf-lighthouse-agentic-browsing)."
      - "Treat experimental agent protocols as versioned low-confidence capabilities (04-CLAUDE-CODE-BUILD-PROMPT §10)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developer.chrome.com/docs/ai/webmcp"
      - "https://developer.chrome.com/docs/lighthouse/agentic-browsing"
