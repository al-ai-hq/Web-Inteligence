# fly.toml app configuration file generated for wpi-web-delicate-dawn-7818 on 2026-10-14T11:29:09+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'wpi-web-delicate-dawn-7818'
primary_region = 'fra'

[env]
  WPI_DISPATCH_MODE = 'in_process'
  WPI_MIGRATIONS_DIR = '/app/packages/audit-pipeline/src/migrations'

[deploy]
  release_command = "node packages/audit-pipeline/dist/migrations/migrate-cli.js"

[build]
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = 'tcp'
  internal_port = 3000
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/health"
    protocol = "http"

  [services.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
