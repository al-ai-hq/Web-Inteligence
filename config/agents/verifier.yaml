# Purpose: Runtime tool allowlist for the verifier agent. Enforced in code, not only in prompts.
# Owner role: AI engineer, with the security owner
# Source sections: 02-DETAILED-SPECIFICATION §13 (agent table and exact runtime allowlists); 03-PRODUCTION-CONTRACTS (Agent tool boundaries); 05-PROJECT-PLAN §5 (milestones);
#                  docs/decisions.md D-009, D-011, D-012
# Status: draft for review
#
# reads_untrusted_content is true because the agent receives text that originated outside the system
# (page content, CMS content, tool or model output, user input). Such text is data, never instructions.
# No write-class tool may appear in tools. Only the deterministic connector service holds write credentials.
# Note: request_rollback asks the connector service to act; the verifier never writes.
# Note: 'verified' requires a fresh fetch; never verify from a CMS API response alone.

name: verifier
milestone: "M9"
reads_untrusted_content: true
model_tier: fast_or_none
tools:
  - refetch
  - eval_rule
  - gsc_inspect
  - request_rollback
forbidden_tools:
  - apply_change
  - publish
  - write_cms
  - delete_content
  - upload_disavow
  - send_email
  - submit_form
  - approve_change
