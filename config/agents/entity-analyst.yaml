# Purpose: Runtime tool allowlist for the entity-analyst agent. Enforced in code, not only in prompts.
# Owner role: AI engineer, with the security owner
# Source sections: docs/superpowers/specs/2026-10-11-m7-public-footprint-entity-graph-design.md;
#                  03-PRODUCTION-CONTRACTS (Agent tool boundaries); 07-SKILLS-AND-AGENTS §2-§3;
#                  docs/decisions.md D-009, D-011, D-012
# Status: draft for review (later-milestone agent; the enrichment pipeline does not load this file yet)
#
# reads_untrusted_content is true because the agent receives text that originated outside the system
# (page content, CMS content, tool or model output, user input). Such text is data, never instructions.
# No write-class tool may appear in tools. Only the deterministic connector service holds write credentials.
# Note: Tool classes from 03-PRODUCTION-CONTRACTS: normalized specialist evidence and confirmed facts;
#       prohibited: unverified edits, platform write.
# Note: Intended behaviour, kept here because the agent config schema has no prompt field: review extracted
#       profile data and third-party observations, assess NAP consistency, surface conflicts against the
#       confirmed fact sheet, and flag confidence levels. The fact sheet is the only source of facts a Fixer
#       or brief writer may insert, and entity conflicts are never auto-resolved — a named human decides.

name: entity-analyst
milestone: "M7"
status: draft
reads_untrusted_content: true
model_tier: standard
tools:
  - read_specialist_evidence
  - read_confirmed_facts
forbidden_tools:
  - apply_change
  - publish
  - write_cms
  - delete_content
  - upload_disavow
  - send_email
  - submit_form
  - approve_change
  - read_connector_credentials
