# Purpose: Registry of time-sensitive provider, platform, schema and policy facts the product relies on.
#          Each fact carries its primary source, checked date, owner, review date and expiry. An expired or
#          unverified fact must not drive a recommendation, a score or client-facing text.
# Owner role: Provider-policy owner, with the SEO lead, AI engineer and integration engineer per fact
# Source sections: 02-DETAILED-SPECIFICATION §2, §6, §7, §8, §10, §12, §13, §15, §17;
#                  08-REFERENCE-LIBRARY (Sources checked); 01-PRODUCT-REQUIREMENTS §8, §15, §16;
#                  03-PRODUCTION-CONTRACTS (Required configuration, PolicyFact); docs/decisions.md D-010
# Status: draft for review
#
# Field rules:
# - checked_on: the date 08-REFERENCE-LIBRARY records for the source. Where the library lists a link
#   without its own date, "2026-09-29" is used, the start of its "links checked 29-30 September 2026" range.
#   source_updated_on is the page's own update date where the library gives one.
# - review_by and expires_on are ASSUMPTIONS: review one month after the check (monthly registry review,
#   02-DETAILED-SPECIFICATION §6 and v1-baseline §11.3) and expire at the end of the following quarter,
#   unless the fact itself has an earlier date.
# - status: verified_in_library (a checked primary source exists) or needs_verification (no verified URL;
#   source_url is "<confirm>"). needs_verification facts are hypotheses until checked.
# - source_tier: 1 primary documentation or open standard; 2 independent study with method; 3 vendor claim.

version: "0.1.0-draft"
defaults:
  review_by: "2026-10-30"
  expires_on: "2026-12-31"
  on_expiry: "Treat the fact as unavailable; block client-facing use until an owner re-verifies it (01-PRODUCT-REQUIREMENTS §8)."

