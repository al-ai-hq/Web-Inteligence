  - id: AEO-007
    title: "FAQ quality"
    category: aeo
    importance_weight: 2
    scored: true
    connected_tier_only: false
    applicability: "Sites that publish FAQ content; otherwise not_applicable. A missing FAQ block is never a failure."
    standards:
      pass: "FAQ content is useful, non-duplicative, and visible."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.4 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    notes:
      - "FAQ rich results no longer appear in Google Search (since 7 May 2026); FAQ content is judged for readers only."
    source_reference:
      - "v1-baseline §7.4"
      - "https://developers.google.com/search/docs/appearance/structured-data/faqpage"

