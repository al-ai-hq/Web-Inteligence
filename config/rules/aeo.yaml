# Purpose: Rule definitions for the Answer Engine Optimization content category (weight 20)
#          of Presence Readiness.
# Owner role: Methodology owner (SEO lead)
# Source sections: v1-baseline §6.3, §7, §7.4; 02-DETAILED-SPECIFICATION §6, §13;
#                  08-REFERENCE-LIBRARY (Optimizing for generative AI search, Helpful content)
# Status: draft for review
#
# Field notes: see config/rules/crawlability.yaml.
# evaluation: assessed marks the semantic rules the Auditor agent evaluates with a rubric
# (02-DETAILED-SPECIFICATION §13 names AEO-001, AEO-006 and AEO-009). Rubrics live under docs/rubrics/.
# The Auditor never rewards keyword density or content split into tiny chunks, and never penalizes a
# page for lacking an FAQ block or llms.txt.

methodology_version: "0.1.0-draft"
category: aeo
category_title: "Answer Engine Optimization content"
category_weight: 20

rules:
  - id: AEO-001
    title: "Clear offering"
    category: aeo
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Site states what it provides in concrete language."
      partial: "<DECIDE_AT_M0: partial standard; define in the AEO-001 rubric>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: assessed
    fidelity_label: assessed
    change: unchanged
    source_reference:
      - "v1-baseline §7.4"
      - "02-DETAILED-SPECIFICATION §13"
      - "https://developers.google.com/search/docs/fundamentals/creating-helpful-content"

