      partial: "<DECIDE_AT_M0: partial standard; define in the AEO-009 rubric>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: assessed
    fidelity_label: assessed
    change: modified
    v1:
      title: "Answer extractability"
      pass: "Pages contain self-contained passages that retain meaning when quoted."
      importance_weight: 4
    notes:
      - "Google says content does not need to be split into small chunks for its AI features (02-DETAILED-SPECIFICATION §2, §6)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "02-DETAILED-SPECIFICATION §13"
      - "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"

