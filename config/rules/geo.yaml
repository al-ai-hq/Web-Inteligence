    change: unchanged
    source_reference: ["v1-baseline §7.5"]

  - id: GEO-005
    title: "Evidence for claims"
    category: geo
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "Pages in the sample that make material claims."
    standards:
      pass: "Material claims have primary evidence, methodology, or attributable sources."
      partial: "<DECIDE_AT_M0: partial standard; define in the GEO-005 rubric>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: assessed
    fidelity_label: assessed
    change: unchanged
    source_reference: ["v1-baseline §7.5", "02-DETAILED-SPECIFICATION §13"]

  - id: GEO-006
    title: "Source quality"
    category: geo
    importance_weight: 4
    scored: true
    connected_tier_only: false
    applicability: "Pages in the sample that cite sources."
    standards:
      pass: "Citations link to relevant authoritative or primary sources."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.5 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.5"]

  - id: GEO-007
    title: "Non-commodity content"
    category: geo
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Non-commodity content: first-hand data, original examples, expert view. Rubric-assessed and labelled assessed."
      partial: "<DECIDE_AT_M0: partial standard; define in the GEO-007 rubric>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: assessed
    fidelity_label: assessed
    change: modified
    v1:
      title: "Original information"
      pass: "Site contributes specific facts, data, examples, or expert knowledge."
      importance_weight: 3
    notes:
      - "Assessed results are labelled in every report and count only at their rule weight (02-DETAILED-SPECIFICATION §15)."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "02-DETAILED-SPECIFICATION §15"
      - "https://developers.google.com/search/docs/fundamentals/creating-helpful-content"

  - id: GEO-008
    title: "Entity connections"
    category: geo
    importance_weight: 2
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Official profiles and related entities are linked consistently."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.5 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
