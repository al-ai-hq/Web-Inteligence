  - id: GEO-009
    title: "Reputation signals on site"
    category: geo
    importance_weight: 2
    scored: true
    connected_tier_only: false
    applicability: "Sites that show credentials or case evidence; otherwise not_applicable."
    standards:
      pass: "Credentials and case evidence are specific and verifiable, not fabricated."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.5 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.5"]

  - id: GEO-010
    title: "Optional machine-readable summary (llms.txt)"
    category: geo
    importance_weight: 0
    scored: false
    connected_tier_only: false
    applicability: "All audits. Reported only."
    standards:
      report: "Report whether a maintained llms.txt exists. Absence is never a failure. A published file that points to dead pages is flagged."
    evaluation: deterministic
    fidelity_label: computed
    change: modified
    v1:
      pass: "A maintained llms.txt may earn limited credit; absence is not a failure."
      importance_weight: 1
    notes:
      - "Google Search ignores llms.txt; other systems may use it (02-DETAILED-SPECIFICATION §2, §6)."
      - "Never plan llms.txt as a Google ranking factor."
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developers.google.com/search/docs/fundamentals/ai-optimization-guide"
      - "https://llmstxt.org"

  - id: GEO-011
    title: "Business Profile and Merchant Center consistency"
    category: geo
    importance_weight: 3
    scored: true
    connected_tier_only: false
    requires_data: business_profile_or_merchant_center
    applicability: >-
      Where Business Profile or Merchant Center details apply and have been supplied. 02-DETAILED-SPECIFICATION §16
      lists these sources as connected and optional, so the rule is normally not_applicable in anonymous audits.
    standards:
      pass: "Business Profile and Merchant Center details match the site, where they apply."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "A fact-sheet, site or Business Profile disagreement raises an entity-conflict finding that is never auto-resolved (02-DETAILED-SPECIFICATION §3, §15)."
    source_reference: ["02-DETAILED-SPECIFICATION §6", "02-DETAILED-SPECIFICATION §16"]
