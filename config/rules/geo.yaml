    title: "Author/editor identity"
    category: geo
    importance_weight: 3
    scored: true
    connected_tier_only: false
    applicability: "Advice or editorial content in the sample; otherwise not_applicable."
    standards:
      pass: "Advice or editorial content identifies responsible authors or reviewers."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.5 gives the pass standard only>"
