# Purpose: Rule definitions for the GEO entity clarity, authority, and citations category (weight 15)
#          of Presence Readiness, including modified GEO-007 and GEO-010 and new GEO-011.
# Owner role: Methodology owner (SEO lead)
# Source sections: v1-baseline §6.3, §7, §7.5; 02-DETAILED-SPECIFICATION §6, §13, §15, §16;
#                  08-REFERENCE-LIBRARY (Optimizing for generative AI search, llms.txt proposal, Helpful content)
# Status: draft for review
#
# Field notes: see config/rules/crawlability.yaml.
# evaluation: assessed marks the semantic rules the Auditor agent evaluates with a rubric
# (02-DETAILED-SPECIFICATION §13 names GEO-005 and GEO-007; §15 lists GEO-007 as assessed).

methodology_version: "0.1.0-draft"
category: geo
category_title: "GEO entity clarity, authority, and citations"
category_weight: 15

rules:
  - id: GEO-001
    title: "Consistent entity name"
    category: geo
    importance_weight: 5
    scored: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "Organization name is consistent across major pages and markup."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.5 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    notes:
      - "Arabic and English names and approved transliterations count as the same entity when the Owner confirms them."
    source_reference: ["v1-baseline §7.5"]

  - id: GEO-002
    title: "About/entity page"
    category: geo
    importance_weight: 4
    scored: true
    connected_tier_only: false
