# Purpose: Rule definitions for the On-page technical SEO category (weight 15) of Presence Readiness,
#          including the keyword-data rules SEO-011 and SEO-012 and the SPAM-001 critical flag.
# Owner role: Methodology owner (SEO lead)
# Source sections: v1-baseline §6.3, §7, §7.2; 02-DETAILED-SPECIFICATION §6, §7, §8;
#                  08-REFERENCE-LIBRARY (SEO Starter Guide, Spam policies)
# Status: draft for review
#
# Field notes: see config/rules/crawlability.yaml. Unscored rules have importance_weight 0.
# SPAM-001 placement in this category is an ASSUMPTION: 02-DETAILED-SPECIFICATION §6 assigns it no
# category; it sits next to SEO-008 (duplicate content indicators). It has no weight and acts only
# through its critical cap in config/scoring.yaml.

methodology_version: "0.1.0-draft"
category: on_page
category_title: "On-page technical SEO"
category_weight: 15

rules:
