    title: "Unique page title"
    category: on_page
    importance_weight: 4
    scored: true
    connected_tier_only: false
    applicability: "Important pages in the audited sample."
    standards:
      pass: "Important pages have descriptive, unique titles."
      partial: "<DECIDE_AT_M0: partial standard; v1-baseline §7.2 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: unchanged
    source_reference: ["v1-baseline §7.2", "https://developers.google.com/search/docs/fundamentals/seo-starter-guide"]

