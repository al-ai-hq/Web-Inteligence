  - id: SEO-011
    title: "Keyword cluster mapped to one page"
    category: on_page
    importance_weight: 3
    scored: true
    connected_tier_only: false
    requires_data: keyword_data
    applicability: "Only when validated keyword data and clusters exist; otherwise not_applicable (02-DETAILED-SPECIFICATION §6, §7)."
    standards:
      pass: "Each priority keyword cluster maps to one indexable page."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "Keyword clustering and page mapping are connected-workspace outputs (02-DETAILED-SPECIFICATION §2, §16), so this rule is normally not_applicable in anonymous audits."
    source_reference: ["02-DETAILED-SPECIFICATION §6", "02-DETAILED-SPECIFICATION §7"]

  - id: SEO-012
    title: "No split cluster (cannibalization)"
    category: on_page
    importance_weight: 3
    scored: true
    connected_tier_only: false
    requires_data: keyword_data
    applicability: "Only when validated keyword data with impressions exists; otherwise not_applicable (02-DETAILED-SPECIFICATION §6, §7)."
    standards:
      pass: "No two indexable pages split a cluster's impressions without a clear primary page."
      partial: "<DECIDE_AT_M0: partial standard; 02-DETAILED-SPECIFICATION §6 gives the pass standard only>"
      fail: "Neither the pass nor the partial standard is met."
    evaluation: deterministic
    fidelity_label: computed
    change: new
    notes:
      - "Cannibalization thresholds are configuration owned by the keyword-mapping method (02-DETAILED-SPECIFICATION §13); no universal threshold is set here."
    source_reference: ["02-DETAILED-SPECIFICATION §6", "02-DETAILED-SPECIFICATION §7"]

  - id: SPAM-001
    title: "Spam-policy screen"
    category: on_page
    importance_weight: 0
    scored: false
    critical_flag: true
    connected_tier_only: false
    applicability: "All audits."
    standards:
      pass: "No scaled or templated thin pages, doorway patterns, hidden text or fabricated review markup."
      fail: "A confirmed finding of scaled or templated thin pages, doorway patterns, hidden text or fabricated review markup."
    evaluation: deterministic
    fidelity_label: computed
    critical_cap: spam_policy_confirmed
    change: new
    notes:
      - "A confirmed failure is a Critical finding and blocks automatic fixes on the affected pages (02-DETAILED-SPECIFICATION §6)."
      - "ASSUMPTION: overall cap of 50 pending calibration (see config/scoring.yaml critical_caps)."
      - "<DECIDE_AT_M0: what confirms a SPAM-001 failure; whether screening needs an assessed step for scaled or doorway patterns>"
    source_reference:
      - "02-DETAILED-SPECIFICATION §6"
      - "https://developers.google.com/search/docs/essentials/spam-policies"
