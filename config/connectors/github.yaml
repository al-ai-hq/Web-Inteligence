# Purpose: Capability and policy config for the GitHub pull-request connector for custom or static sites:
#          auth, permissions, allowed change classes with risk tiers, merge and publish rules, webhook secret
#          reference, rate-limit notes. Read only by the deterministic connector service.
# Owner role: Integration engineer
# Source sections: 02-DETAILED-SPECIFICATION §2, §10, §13, §17, §19; 03-PRODUCTION-CONTRACTS (Change risk baseline);
#                  04-CLAUDE-CODE-BUILD-PROMPT §15; 07-SKILLS-AND-AGENTS §5, §6; 01-PRODUCT-REQUIREMENTS §5.13;
#                  09-MERGE-DECISIONS; 08-REFERENCE-LIBRARY (GitHub Apps)
# Status: draft for review
#
# Rules for this file:
# - status: candidate. The first CMS/Git connector is an open decision (D-011).
# - The connector opens pull requests only. It never pushes to the default branch and never merges
#   (02-DETAILED-SPECIFICATION §2, §10).
# - GitHub App permission names and webhook signing details are verified at build; none are invented here.

connector_id: github
display_name: "GitHub (pull requests for custom or static sites)"
status: candidate
milestone: M9
reference_urls: ["https://docs.github.com/en/apps"]

auth:
  method: github_app
  installation: "Installed by the site owner on the exact repositories approved for the project (07-SKILLS-AND-AGENTS §5)."
  permissions:
    - permission: "<confirm: repository contents permission needed to create a branch and commit>"
      purpose: "Branch and commit for the pull request"
    - permission: "<confirm: pull request permission>"
      purpose: "Open and update the pull request"
    - permission: "<confirm: metadata read permission>"
      purpose: "Resolve repository and default branch"
  private_key_secret_ref: "<DECIDE_AT_M0: Secret Manager secret name for the GitHub App private key>"
  held_by: connector_service_only
  rotation: "Rotate the App key; uninstall revokes access; never sent to a model (02-DETAILED-SPECIFICATION §17)."

interface: [capabilities, read_fields, snapshot, apply, publish, rollback, verify_webhook]
interface_note: "apply opens or updates a pull request; publish is not available because merging is the site owner's step."

branch_policy:
  target: "Approved repository and base branch only; exact repository/branch approval (07-SKILLS-AND-AGENTS §5)."
  push_to_default_branch: false
  branch_name_pattern: "<DECIDE_AT_M0: branch naming convention for product pull requests>"
  path_policy: "<DECIDE_AT_M0: per-repository map from file paths to change classes, approved at connection time>"

allowed_change_classes:
  - class: image_alt_text
    risk_tier: 1
  - class: meta_description_and_open_graph
    risk_tier: 1
  - class: page_title_and_h1
    risk_tier: 2
    note: "Needs a cannibalization result showing the page owns its main query."
  - class: json_ld
    risk_tier: 2
  - class: content_blocks_on_existing_pages
    risk_tier: 2
  - class: internal_links
    risk_tier: 2
  - class: robots_txt_meta_robots_canonical_hreflang_sitemap
    risk_tier: 3
  - class: redirects_and_slugs
    risk_tier: 3
    note: "A slug change ships with its 301 redirect and internal-link updates in the same pull request."
  - class: templates_or_theme_code
    risk_tier: 3

forbidden:
  - push_to_default_branch
  - merge_pull_request
  - delete_content
  - create_page_without_named_human_author
  - fabricated_reviews_ratings_or_claims
  - hidden_text
  - cloaking
  - link_schemes
  - configure_client_ci
  - write_outside_approved_target_hash_or_expiry

publish_rules:
  default_write_mode: pull_request
  publish_is_separate_step: true
  requires_separate_approval: true
  rule: "Merging and deploying are the site owner's steps outside the product. Approving the pull-request content is not approval to merge or release (01-PRODUCT-REQUIREMENTS §5.13; 07-SKILLS-AND-AGENTS §6)."
  approval_binding: [target, field, before_hash, after_hash, environment, edit_or_publish_mode, approver, expiry]

rollout:
  tier_1: "One approver; at most 25 pages per pull request (ASSUMPTION: the 02-DETAILED-SPECIFICATION §10 tier 1 batch limit applied per pull request)."
  tier_2: "One approver after per-page diff review."
  tier_3: "Two approvers; the requester cannot approve; one change per pull request."
  one_change_set_per_site_at_a_time: true

rollback:
  method: "A revert pull request; merging it is the site owner's step."
  automatic: false

verification: "The verifier re-fetches the live page after the owner deploys; 'live on site' and 'seen by Google' are reported separately (02-DETAILED-SPECIFICATION §10)."

webhook:
  mechanism: "<confirm: GitHub App webhook events for pull-request and push activity; signing method at build>"
  signature_verification: required
  replay_protection: "Reject replayed delivery IDs."
  secret_ref: "<DECIDE_AT_M0: Secret Manager secret name for the GitHub App webhook secret>"
  purpose: "Detect merge and deployment, then queue verification and targeted re-audits."

rate_limits:
  platform_limits: "<confirm: GitHub API rate limits for App installations from current documentation>"
  idempotency_key_required: true
  never_retry_write_without_idempotency_key: true

contract_tests:
  sandbox: "A GitHub test repository (02-DETAILED-SPECIFICATION §19)."
  scenarios: [stale_state, conflict, replay, wrong_tenant, denial, partial_failure, read_back_mismatch, slug_redirect, rollback, token_revoked_mid_run, rate_limited]
